<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Country Details — Country Explorer</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌍</text></svg>">
<script src="/js/theme-init.js"></script>
<link rel="stylesheet" href="/css/output.css">
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen transition-colors duration-300 flex flex-col">

<!-- NAVBAR -->
<header class="sticky top-0 z-50 bg-white/80 dark:bg-gray-900/80 backdrop-blur border-b border-gray-200 dark:border-gray-800">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between h-16">
    <a href="/" class="flex items-center gap-2 text-xl font-bold">
      <span class="text-2xl">🌍</span> Country Explorer
    </a>
    <button id="themeToggle" class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 transition" aria-label="Toggle dark mode">
      <svg id="iconSun" class="w-5 h-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
      <svg id="iconMoon" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
    </button>
  </div>
</header>

<main class="flex-1 max-w-5xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-10">
  <a href="/" class="inline-flex items-center gap-2 text-blue-600 dark:text-blue-400 hover:underline mb-8 text-sm font-semibold">
    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
    Back to all countries
  </a>

  <div id="loadingState" class="grid md:grid-cols-2 gap-10">
    <div class="skeleton h-64 w-full"></div>
    <div class="space-y-3">
      <div class="skeleton h-8 w-2/3"></div>
      <div class="skeleton h-4 w-1/2"></div>
      <div class="skeleton h-4 w-1/3"></div>
      <div class="skeleton h-4 w-1/2"></div>
    </div>
  </div>

  <div id="errorState" class="hidden text-center py-20">
    <p class="text-5xl mb-4">⚠️</p>
    <p id="errorMessage" class="font-semibold text-gray-700 dark:text-gray-300">Country not found</p>
    <a href="/" class="btn-primary mt-5 inline-flex">Back home</a>
  </div>

  <div id="details" class="hidden grid md:grid-cols-2 gap-10 items-start">
    <img id="flagImg" class="w-full rounded-xl shadow-lg border border-gray-200 dark:border-gray-700 object-cover" alt="">

    <div>
      <h1 id="countryName" class="text-3xl md:text-4xl font-extrabold mb-1"></h1>
      <p id="officialName" class="text-gray-500 dark:text-gray-400 mb-6"></p>

      <div class="space-y-3">
        <div class="flex gap-2 text-sm">
          <span class="font-semibold w-32 shrink-0 text-gray-500 dark:text-gray-400">Capital</span>
          <span id="capital" class="text-gray-900 dark:text-gray-100"></span>
        </div>
        <div class="flex gap-2 text-sm">
          <span class="font-semibold w-32 shrink-0 text-gray-500 dark:text-gray-400">Region</span>
          <span id="region" class="text-gray-900 dark:text-gray-100"></span>
        </div>
        <div class="flex gap-2 text-sm">
          <span class="font-semibold w-32 shrink-0 text-gray-500 dark:text-gray-400">Subregion</span>
          <span id="subregion" class="text-gray-900 dark:text-gray-100"></span>
        </div>
        <div class="flex gap-2 text-sm">
          <span class="font-semibold w-32 shrink-0 text-gray-500 dark:text-gray-400">Population</span>
          <span id="population" class="text-gray-900 dark:text-gray-100"></span>
        </div>
        <div class="flex gap-2 text-sm">
          <span class="font-semibold w-32 shrink-0 text-gray-500 dark:text-gray-400">Languages</span>
          <span id="languages" class="text-gray-900 dark:text-gray-100"></span>
        </div>
        <div class="flex gap-2 text-sm">
          <span class="font-semibold w-32 shrink-0 text-gray-500 dark:text-gray-400">Currencies</span>
          <span id="currencies" class="text-gray-900 dark:text-gray-100"></span>
        </div>
      </div>

      <div id="bordersWrap" class="mt-6">
        <p class="font-semibold text-sm text-gray-500 dark:text-gray-400 mb-2">Bordering Countries</p>
        <div id="borders" class="flex flex-wrap gap-2"></div>
      </div>
    </div>
  </div>
</main>

<footer class="border-t border-gray-200 dark:border-gray-800 py-8 text-center text-sm text-gray-400">
  Data from <a href="https://restcountries.com" target="_blank" rel="noopener" class="underline hover:text-blue-500">restcountries.com</a> · Built with Express &amp; Tailwind CSS
</footer>

<script src="/js/theme-toggle.js"></script>
<script src="/js/country.js"></script>
</body>
</html>
